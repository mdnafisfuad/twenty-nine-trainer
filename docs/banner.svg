<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Twenty-Nine Trainer: a local-first card table with a coach that plays fair">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1c4d38" />
      <stop offset="0.48" stop-color="#143a29" />
      <stop offset="1" stop-color="#0a1c14" />
    </linearGradient>
    <radialGradient id="brassGlow" cx="0.78" cy="0.42" r="0.52">
      <stop offset="0" stop-color="#c7a86a" stop-opacity="0.16" />
      <stop offset="0.55" stop-color="#c7a86a" stop-opacity="0.05" />
      <stop offset="1" stop-color="#c7a86a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#050806" stop-opacity="0" />
      <stop offset="1" stop-color="#050806" stop-opacity="0.62" />
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9ae" />
      <stop offset="0.45" stop-color="#c7a86a" />
      <stop offset="1" stop-color="#9c7f4a" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f7f2e4" />
      <stop offset="1" stop-color="#e9e2cf" />
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16402d" />
      <stop offset="0.55" stop-color="#0f2d20" />
      <stop offset="1" stop-color="#091c14" />
    </linearGradient>
    <pattern id="lattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H22M0 0V22" fill="none" stroke="#e6d3a8" stroke-opacity="0.13" stroke-width="1" />
      <circle cx="0" cy="0" r="1.4" fill="#e6d3a8" fill-opacity="0.18" />
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020403" flood-opacity="0.55" />
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="26" y="26" width="1548" height="468" rx="16" />
    </clipPath>
    <g id="card-face">
      <rect x="-90" y="-126" width="180" height="252" rx="12" fill="url(#paper)" stroke="#cdc1a4" stroke-width="1.5" />
      <rect x="-80" y="-116" width="160" height="232" rx="7" fill="none" stroke="#ddd3bc" stroke-width="1" />
    </g>
  </defs>

  <rect width="1600" height="520" rx="26" fill="#080b09" />
  <g clip-path="url(#frameClip)">
    <rect x="26" y="26" width="1548" height="468" rx="16" fill="url(#felt)" />
    <rect x="26" y="26" width="1548" height="468" rx="16" fill="url(#brassGlow)" />
    <rect x="26" y="26" width="1548" height="468" rx="16" fill="url(#vignette)" />
    <rect x="26" y="26" width="1548" height="468" rx="16" fill="#ffffff" filter="url(#grain)" opacity="0.055" />
    <text x="826" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="520" fill="#e6d3a8" fill-opacity="0.035" aria-hidden="true">♠</text>
  </g>

  <rect x="26" y="26" width="1548" height="468" rx="16" fill="none" stroke="url(#brass)" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="42" y="42" width="1516" height="436" rx="10" fill="none" stroke="#e6d3a8" stroke-opacity="0.16" />

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="112" y="158" font-size="13" font-weight="600" letter-spacing="4.2" fill="#d8bf8e">LOCAL-FIRST · NO ACCOUNTS · NO API KEYS</text>
    <text x="106" y="258" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="96" font-weight="500" letter-spacing="-2" fill="#f2ecdd">Twenty-Nine</text>
    <text x="112" y="300" font-size="15" font-weight="600" letter-spacing="13" fill="#c7a86a">T R A I N E R</text>
    <text x="112" y="356" font-size="24" fill="#e6e0d2" fill-opacity="0.78">A quiet card table with a coach that plays fair.</text>
    <path d="M112 388 H176" stroke="#c7a86a" stroke-opacity="0.6" stroke-width="1.5" />
    <g font-size="11" font-weight="600" letter-spacing="2.4" fill="#d8bf8e" fill-opacity="0.75">
      <text x="112" y="433">CONTRACT 28 / 29</text>
      <circle cx="308" cy="429" r="2" fill="#c7a86a" fill-opacity="0.6" />
      <text x="332" y="433">REVERSE VARIANTS</text>
      <circle cx="520" cy="429" r="2" fill="#c7a86a" fill-opacity="0.6" />
      <text x="544" y="433">OFFLINE PWA</text>
    </g>
  </g>

  <g aria-hidden="true">
    <circle cx="1248" cy="264" r="214" fill="none" stroke="#e6d3a8" stroke-opacity="0.06" />
    <circle cx="1248" cy="264" r="178" fill="none" stroke="#e6d3a8" stroke-opacity="0.05" />

    <g transform="translate(1092 302) rotate(-23)" filter="url(#cardShadow)">
      <use href="#card-face" />
      <text x="-66" y="-74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1d241f">7</text>
      <text x="-65" y="-38" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#a83a34">♦</text>
      <g transform="rotate(180)">
        <text x="-66" y="-74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1d241f">7</text>
        <text x="-65" y="-38" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#a83a34">♦</text>
      </g>
      <text x="0" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#a83a34" fill-opacity="0.9">♦</text>
    </g>

    <g transform="translate(1180 272) rotate(-11)" filter="url(#cardShadow)">
      <use href="#card-face" />
      <text x="-66" y="-74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1d241f">9</text>
      <text x="-65" y="-38" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#a83a34">♥</text>
      <g transform="rotate(180)">
        <text x="-66" y="-74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1d241f">9</text>
        <text x="-65" y="-38" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#a83a34">♥</text>
      </g>
      <text x="0" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#a83a34" fill-opacity="0.9">♥</text>
    </g>

    <g transform="translate(1268 258) rotate(-1)" filter="url(#cardShadow)">
      <use href="#card-face" />
      <text x="-66" y="-74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1d241f">J</text>
      <text x="-65" y="-38" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#1d241f">♠</text>
      <g transform="rotate(180)">
        <text x="-66" y="-74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1d241f">J</text>
        <text x="-65" y="-38" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#1d241f">♠</text>
      </g>
      <text x="0" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#1d241f" fill-opacity="0.9">♠</text>
    </g>

    <g transform="translate(1378 296) rotate(11)" filter="url(#cardShadow)">
      <rect x="-95" y="-133" width="190" height="266" rx="13" fill="url(#back)" stroke="url(#brass)" stroke-width="2" />
      <rect x="-85" y="-123" width="170" height="246" rx="8" fill="none" stroke="#e6d3a8" stroke-opacity="0.36" />
      <rect x="-85" y="-123" width="170" height="246" rx="8" fill="url(#lattice)" />
      <circle cx="0" cy="0" r="47" fill="#0b2419" stroke="#d8bf8e" stroke-opacity="0.72" stroke-width="1.5" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#d8bf8e" stroke-opacity="0.3" />
      <text x="0" y="13" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#ecd9ae">29</text>
      <g fill="#e6d3a8" fill-opacity="0.55">
        <path d="M0 -103 l6 7 -6 7 -6 -7 z" />
        <path d="M0 103 l6 -7 -6 -7 -6 7 z" />
        <path d="M-65 0 l7 6 -7 6 -7 -6 z" />
        <path d="M65 0 l7 6 -7 6 -7 -6 z" />
      </g>
    </g>
  </g>
</svg>
